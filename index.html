<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Pixel Pomodoro</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <div class="title">Pomodoro<br>Timer</div>

    <div class="main-layout">
      <div class="left">
        <div class="clock-box">
          <span id="timerDisplay">25:00</span>
        </div>

        <div class="session-label" id="sessionLabel">Focus Time</div>
        <div class="quote" id="quoteText">take a breath,<br>you are right on time ☺</div>

        <div class="btnStartPause">
          <button id="btnStartPause" class="btn">Start</button>
        </div>
        <div class="btnReset">
          <button id="btnReset" class="btn">Reset</button>
        </div>
      </div>

      <div class="right">
        <div class="setting-item">
          <div class="setting-label">Focus:</div>
          <input type="number" id="inputFocus" class="setting-input" value="25" min="1" max="99">
        </div>
        <div class="setting-item">
          <div class="setting-label">Short Break:</div>
          <input type="number" id="inputShort" class="setting-input" value="5" min="1" max="99">
        </div>
        <div class="setting-item">
          <div class="setting-label">Long Break:</div>
          <input type="number" id="inputLong" class="setting-input" value="15" min="1" max="99">
        </div>
      </div>
    </div>

  </div>
  <script src="renderer.js"></script>
</body>
</html>
